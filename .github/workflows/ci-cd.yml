name: CI and Docker

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-check:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm run build
        working-directory: client

  server-check:
    name: Server checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm run build
        working-directory: server

  contract-check:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - run: npm ci
        working-directory: contract
      - run: npm run compile
        working-directory: contract
      - name: Verify generated OpenAPI is up to date
        run: git diff --exit-code -- openapi/openapi.yaml
        working-directory: contract

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - client-check
      - server-check
      - contract-check
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major_minor: ${{ steps.release.outputs.major_minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create release from Conventional Commits
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package semantic-release@25.0.9 \
            --package conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release
          release_tag="$(git tag --points-at HEAD --list 'v[0-9]*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' | sort -V | tail -n 1)"
          if [ -z "$release_tag" ]; then
            echo 'tag=' >> "$GITHUB_OUTPUT"
            echo 'version=' >> "$GITHUB_OUTPUT"
            echo 'major_minor=' >> "$GITHUB_OUTPUT"
          else
            version="${release_tag#v}"
            major_minor="$(printf '%s' "$version" | cut -d. -f1-2)"
            echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.client-check.result == 'success' &&
      needs.server-check.result == 'success' &&
      needs.contract-check.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs:
      - client-check
      - server-check
      - contract-check
      - release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: meeting-booking-client
            context: client
          - image: meeting-booking-server
            context: server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Normalize GHCR owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=${{ needs.release.outputs.major_minor }},enable=${{ needs.release.outputs.major_minor != '' }}
          flavor: |
            latest=false
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true
